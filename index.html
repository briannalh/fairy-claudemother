<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fairy Claudemother</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: #fefefe;
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .hero {
      display: block;
      width: 90vw;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }

    @media (min-width: 768px) {
      .hero { width: min(520px, 90vw); }
    }
  </style>
</head>
<body>
  <a class="hero" href="https://www.instagram.com/briannalh/" target="_blank" rel="noopener">
    <img src="images/fairy-claudemother.jpg" width="1040" height="1040" alt="Fairy Claudemother">
  </a>
</body>
</html>
